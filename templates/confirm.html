<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Status</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .icon { font-size: 56px; margin-bottom: 16px; }
        .message {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            line-height: 1.5;
        }
        .message.error { color: #c62828; }
        .message.success { color: #2e7d32; }
        .note { font-size: 13px; color: #888; margin-top: 16px; }
    </style>
</head>
<body>
<div class="card">
    {% if '✅' in message %}
        <div class="icon">✅</div>
        <div class="message success">{{ message }}</div>
        <p class="note">You can close this page now.</p>
    {% else %}
        <div class="icon">❌</div>
        <div class="message error">{{ message }}</div>
        <p class="note">If you think this is a mistake, contact your teacher.</p>
    {% endif %}
</div>

{% if '✅' in message %}
<script>
    // Success hone par localStorage mein set karo
    // Taaki same device dobara same session mein attend na kar sake
    const sid = "{{ session_id }}";
    if (sid) {
        localStorage.setItem("attended_" + sid, "1");
    }
</script>
{% endif %}

</body>
</html>
